[project]
name = "deepseek-cordis"
version = "0.1.0"
description = "Python plugin runtime targeting DeepSeek Harness vendored Cordis semantics"
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Ikram Ali"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
# No optional adapters are implemented; development tools are dependency groups.

[project.urls]
Homepage = "https://github.com/akkefa/deepseek-cordis"
Repository = "https://github.com/akkefa/deepseek-cordis"
Issues = "https://github.com/akkefa/deepseek-cordis/issues"
Documentation = "https://github.com/akkefa/deepseek-cordis/tree/main/docs"
Changelog = "https://github.com/akkefa/deepseek-cordis/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Twine 6.2 validates through core metadata 2.4; retain PEP 639 license fields.
core-metadata-version = "2.4"
packages = ["src/deepseek_cordis"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/.gitignore",
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/README.pypi.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["compatibility: behavior derived from pinned Cordis/Harness sources"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[dependency-groups]
# Opt-in tools for checking metadata and the package-index long description.
packaging = ["twine>=6.2,<7"]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
