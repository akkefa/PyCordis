name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development and packaging tools
        run: uv sync --locked --group packaging

      - name: Test
        run: uv run --locked --group packaging pytest -W error

      - name: Lint
        run: uv run --locked --group packaging ruff check .

      - name: Check formatting
        run: uv run --locked --group packaging ruff format --check .

      - name: Check types
        run: uv run --locked --group packaging mypy --python-version ${{ matrix.python-version }} src tests examples scripts

      - name: Build wheel from source archive
        run: uv build

      # A fresh checkout/build produces exactly one wheel and one source archive.
      - name: Audit distribution contents and metadata
        run: uv run --locked --group packaging python scripts/check_distribution.py dist/*.whl dist/*.tar.gz

      - name: Validate package-index description
        run: uv run --locked --group packaging twine check --strict dist/*.whl dist/*.tar.gz

      - name: Install wheel in an isolated environment
        run: |
          uv venv --no-project --python "${{ matrix.python-version }}" "${RUNNER_TEMP}/deepseek_cordis-wheel"
          uv pip install --no-deps --python "${RUNNER_TEMP}/deepseek_cordis-wheel/bin/python" dist/*.whl

      - name: Check installed public APIs outside checkout
        working-directory: ${{ runner.temp }}
        run: '"${RUNNER_TEMP}/deepseek_cordis-wheel/bin/python" -I "${GITHUB_WORKSPACE}/scripts/check_installation.py"'
